[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qmck"
version = "0.1.0"
description = "QuantumMeasurementContradictionKit: toy experiments for the measurement problem."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
qmck = "qmck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]