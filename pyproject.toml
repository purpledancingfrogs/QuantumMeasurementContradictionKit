[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qmck"
version = "0.1.0"
description = "QuantumMeasurementContradictionKit: sandbox experiments that surface measurement-problem contradictions."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name="purpledancingfrogs"}]
keywords = ["quantum","measurement","decoherence","foundations","simulations"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7","pytest-cov>=4","build>=1","twine>=5"]

[tool.setuptools]
license-files = ["LICENSE"]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]